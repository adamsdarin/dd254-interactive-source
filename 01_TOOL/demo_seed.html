<script>
/* ── DEMONSTRATION BUILD ─────────────────────────────────────────
   Identical to the shipped tool except for this block. Every template library
   is seeded with four fictitious entries, and an empty dashboard with an example
   portfolio of DD-254s (see EXAMPLE PORTFOLIO below), so the workflow can be
   shown without anyone typing setup data first.

   Every value here is invented. Companies, addresses and contract numbers are
   made up; telephone numbers use the 555-01xx range reserved for fiction and
   e-mail addresses use example.com, which is reserved by RFC 2606 and cannot be
   registered. Nothing in this file refers to a real facility, contract or
   person, and it must not be used to prepare an actual DD Form 254.

   Seeding only happens when a library is empty, so anything typed during a
   demonstration survives a reload rather than being overwritten on every load.

   The companies are fictitious; the authorities are not. A demo is where a
   reviewer judges whether the tool gets the rules right, and v1.14.0's seed
   told them CUI was safeguarded under 32 CFR Part 117, which expressly places
   CUI outside its scope. Every citation below was checked against the approved
   library on 14 September 2026, and the regression suite refuses any citation
   in this file that is not on its verified list. */
(function(){
  const B=[
    ['Aurora Dynamics','7AUR1','1400 Kestrel Way, Building 3','Fairfax, VA 22030'],
    ['Meridian Systems','3MER5','88 Halyard Drive','Huntsville, AL 35801'],
    ['Calder Aerospace','9CAL2','2201 Foundry Road, Suite 400','Wichita, KS 67209'],
    ['Northwind Defense','4NWD8','65 Beacon Point Parkway','Groton, CT 06340']
  ];
  const CSOS=[
    ['DCSA Mid-Atlantic (demo)','2001 Rockledge Pike, Suite 200, Linthicum, MD 21090','202-555-0110','midatlantic.demo@example.com'],
    ['DCSA Southeast (demo)','700 Marshland Court, Marietta, GA 30060','202-555-0121','southeast.demo@example.com'],
    ['DCSA Central (demo)','4400 Prairie Center Drive, Overland Park, KS 66210','202-555-0132','central.demo@example.com'],
    ['DCSA Northeast (demo)','130 Harbour Street, Boston, MA 02210','202-555-0143','northeast.demo@example.com']
  ];
  const PEOPLE=[
    ['R. Vance','Facility Security Officer','202-555-0154','r.vance@example.com'],
    ['T. Okafor','Program Security Officer','202-555-0165','t.okafor@example.com'],
    ['M. Lindqvist','Contracting Officer Representative','202-555-0176','m.lindqvist@example.com'],
    ['J. Serrano','Security Manager','202-555-0187','j.serrano@example.com']
  ];
  function uid(){ try{ return crypto.randomUUID(); }catch(e){ return 'demo-'+Math.random().toString(36).slice(2,10); } }
  function seed(key,rows){
    try{
      const cur=tplLoad(key)||[];
      if(cur.length) return false;
      tplSave(key,rows.map(function(r){ r.ioId=r.ioId||uid(); return r; }));
      return true;
    }catch(e){ return false; }
  }
  function ctData(over){
    const d=(typeof ctBlankData==='function')?ctBlankData():{c10:{},l10:{},c11:{},l11:{},c18:{},i16:{}};
    Object.keys(over||{}).forEach(function(k){ d[k]=over[k]; });
    return d;
  }
  function demoSeed(){
    seed(TPL_FAC, B.map(function(b,i){
      return {label:b[0]+' ('+b[1]+')', text:b[0]+'\n'+b[2]+'\n'+b[3], cage:b[1],
              email:'fso.'+b[1].toLowerCase()+'@example.com'};
    }));
    seed(TPL_CSO, CSOS.map(function(c){
      return {label:c[0], name:c[0], address:c[1], phone:c[2], email:c[3]};
    }));
    seed(TPL_PERF, B.map(function(b,i){
      return {label:b[0]+' — '+b[3].split(',')[0]+' ('+b[1]+')',
              name:b[0]+'\n'+b[2]+'\n'+b[3], org:(i<2?'Aurora Group (demo)':'Calder Holdings (demo)'),
              cage:b[1], cso:CSOS[i][0], email:'fso.'+b[1].toLowerCase()+'@example.com',
              cma:(i%2===0)?('PO Box '+(1200+i*7)+'\n'+b[3]):''};
    }));
    seed(TPL_CERT, PEOPLE.map(function(p,i){
      return {label:p[0]+' — '+p[1], name:p[0], title:p[1],
              address:B[i][2]+', '+B[i][3], cage:B[i][1], phone:p[2], email:p[3]};
    }));
    seed(TPL_SM, PEOPLE.map(function(p,i){
      return {label:p[0], name:p[0], email:p[3], program:['Programme ALDER (demo)','Programme BIRCH (demo)','Programme CEDAR (demo)','Programme DAMSON (demo)'][i]};
    }));
    seed(TPL_SL, [
      {label:'Derivative classification', text:'Reference 11c:\n\nAll classified material generated or derived under this effort shall be marked in accordance with the applicable security classification guide.'},
      {label:'Subcontracting notice', text:'Reference 10a:\n\nFurther disclosure of classified information, to include subcontracting at any tier, requires prior written approval of the Government Contracting Activity.'},
      {label:'Visit authorisation', text:'Reference 11a:\n\nThe host will verify each visitor\'s personnel clearance through a CSA-designated database or a visit authorization letter (32 CFR 117.16(a)(4)). Visit requests shall cite this contract number.'},
      {label:'Return or destruction', text:'Reference 13:\n\nUpon completion of the contract, the contractor must return all USG-provided or deliverable information to USG custody; unless the GCA advises otherwise, copies may be retained for two years (32 CFR 117.13(d)(5)). Destruction records are required for TOP SECRET material (32 CFR 117.15(e)(2)(vii)).'}
    ]);
    seed(TPL_B13, [
      {label:'CPFF Research — SECRET (demo)', data:ctData({cls:'',c10:{'10a':true,'10b':true},c11:{'11a':true,'11c':true},i14:'no',i15:'yes',i15text:'Inspections by the cognizant security office.'})},
      {label:'FFP Services — CONFIDENTIAL (demo)', data:ctData({c11:{'11e':true},i14:'no',i15:'no'})},
      {label:'IDIQ Task Order — SECRET/CUI (demo)', data:ctData({cls:'CUI',c10:{'10b':true},c11:{'11c':true,'11l':true},i14:'yes',i14text:'CUI handling per 32 CFR Part 2002 and the CUI designation block in Item 13.'})},
      {label:'Subcontract flow-down — SECRET (demo)', data:ctData({c10:{'10a':true},c11:{'11b':true,'11c':true},i14:'no',i15:'yes',i15text:'Prime retains inspection responsibility.'})}
    ]);
    seed(TPL_CT, [
      {label:'Aurora Dynamics — Programme ALDER (demo)', srcDate:'2026-02-02', smName:'R. Vance', smEmail:'r.vance@example.com', smProgram:'Programme ALDER (demo)',
       data:ctData({primeContract:'HQ0034-25-D-0101', taskOrder:'', c10:{'10a':true}, l10:{'10a':'Reference 10a:\n\nAccess to COMSEC information requires a final entity eligibility determination and a final personnel clearance at the appropriate level (32 CFR 117.21(c)(3)).'}})},
      {label:'Task Order 0042 — Meridian (demo)', srcDate:'2026-03-14', smName:'T. Okafor', smEmail:'t.okafor@example.com', smProgram:'Programme BIRCH (demo)',
       data:ctData({primeContract:'HQ0034-25-D-0101', taskOrder:'0042', c11:{'11c':true}, l11:{'11c':'Reference 11c:\n\nThe contractor will reference the applicable security classification guide when generating or deriving classified material.'}})},
      {label:'Calder Aerospace — Programme CEDAR (demo)', srcDate:'2026-04-01', smName:'M. Lindqvist', smEmail:'m.lindqvist@example.com', smProgram:'Programme CEDAR (demo)',
       data:ctData({primeContract:'N00178-25-D-2204', c11:{'11l':true}, l11:{'11l':'Reference 11l:\n\nControlled Unclassified Information generated under this contract shall be marked and safeguarded per 32 CFR Part 2002 and the CUI designation block below. CUI requirements are outside the scope of 32 CFR Part 117 (32 CFR 117.7(h)(1)(iii)).'}})},
      {label:'Northwind Defense — Programme DAMSON (demo)', srcDate:'2026-05-20', smName:'J. Serrano', smEmail:'j.serrano@example.com', smProgram:'Programme DAMSON (demo)',
       data:ctData({primeContract:'SP4701-25-C-3310', taskOrder:'0007', c10:{'10b':true}, l10:{'10b':'Reference 10b:\n\nRestricted Data access is limited to personnel briefed under the applicable programme access requirements.'}})}
    ]);
    /* Fictitious guides: invented titles and identifiers, no real programme. */
    if(typeof TPL_SCG!=='undefined') seed(TPL_SCG, [
      {label:'Programme ALDER Security Classification Guide (demo)', ident:'SCG-ALD-01', date:'2026-02-02', office:'Programme ALDER Office (demo)', dist:'', delivery:'attached'},
      {label:'Programme BIRCH Security Classification Guide (demo)', ident:'SCG-BIR-03', date:'2026-03-14', office:'Programme BIRCH Office (demo)', dist:'', delivery:'separate'},
      {label:'Programme CEDAR Security Classification Guide (demo)', ident:'SCG-CED-02', date:'2026-04-01', office:'Programme CEDAR Office (demo)', dist:'', delivery:'attached'}
    ]);
    if(typeof buildTplSelects==='function') buildTplSelects();
    if(typeof dashRenderCards==='function') dashRenderCards();
    window.DD254_DEMO_PORTFOLIO=seedPortfolio().catch(function(){ return false; });
  }
  /* ── EXAMPLE PORTFOLIO (v1.15.6) ───────────────────────────────
     A reviewer should see the dashboard at work without building a chain first,
     so an empty dashboard gets a handful of fictitious DD-254s: a solicitation
     skipped straight to an Original whose performance ends soon, an Original
     with an issued Revision 1 carrying its biennial review date and a Draft
     Revision 2, a SAP subcontract Blocked on the Program Security Officer
     approval hold, a pair of task orders issued together, a subcontract Final
     with its disposition clock running, one Ready to sign and one Cancelled - so
     every status chip has something in it. Dates are relative to today so the
     clocks stay live, and every title says "(example)". Seeded only when there
     are no drafts at all, so nothing typed during a demonstration is replaced. */
  function isoDay(n){ const d=new Date(); d.setUTCHours(12,0,0,0); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().split('T')[0]; }
  function ymd(n){ return isoDay(n).replace(/-/g,''); }
  function stamp(n,hhmm){ return isoDay(n)+'T'+(hhmm||'15:00')+':00.000Z'; }
  const EX13='Reference 11c:\n\nThe contractor will reference the applicable security classification guide when generating or deriving classified material.';
  const EXNOTE='Example record seeded by the demonstration build. Every name, number and date is fictitious.';
  function exParty(i){ return B[i][0]+'\n'+B[i][2]+'\n'+B[i][3]; }
  function exWs(i,o){
    const c=CSOS[i], p=PEOPLE[2];
    const ws={texts:{i2a:'',i6a:exParty(i),i6b:B[i][1],i6c:c[0]+'\n'+c[1],i6fsoEmail:'fso.'+B[i][1].toLowerCase()+'@example.com',
        i9:'Engineering and test support for a ground station integration effort (example).',
        i12:'Program Public Affairs Office (demo), 100 Liberty Avenue, Arlington, VA 22202',item13:EX13,
        i16a:'Army Contracting Command (demo)',i16b:'W91CRB',i16c:'6001 Combat Drive, Aberdeen Proving Ground, MD 21005',i16d:p[0],i16e:p[2],i16f:p[3],
        i17a:p[0],i17b:'Contracting Officer',i17c:'6001 Combat Drive, Aberdeen Proving Ground, MD 21005',i17d:'W91CRB',i17f:p[2],i17g:p[3]},
      selects:{fcl1a:'S',sfg1b:'S'},radios:{spec:'3a',fo:'no',fin:'no',i12route:'dir',i14:'no',i15:'no'},
      checks:{c11c:true,dist18a:true,dist18e:true},perf:[]};
    ['texts','selects','radios','checks'].forEach(function(g){ Object.keys((o&&o[g])||{}).forEach(function(k){ ws[g][k]=o[g][k]; }); });
    if(o&&o.perf) ws.perf=o.perf;
    return ws;
  }
  function exRec(id,title,stage,status,ws,o){
    const t=ws.texts;
    return Object.assign({id:id,title:title,stage:stage,status:status,workspace:ws,todos:[],notes:EXNOTE,holds:[],dist:[],
      createdAt:stamp(-30),updatedAt:stamp(-30),
      meta:{contract:t.i2a||t.i2b||t.i2c||'',cage7:t.i7b||'',contractor:String(t.i6a||'').split('\n')[0]}},o||{});
  }
  function exDist(n,i,more){
    return [{ts:stamp(n,'15:10'),party:'18a',to:'fso.'+B[i][1].toLowerCase()+'@example.com',method:'e-mail'},
            {ts:stamp(n,'15:10'),party:'18e',to:CSOS[i][3],method:'e-mail'}].concat(more||[]);
  }
  async function seedPortfolio(){
    if(typeof draftAll!=='function'||typeof draftPut!=='function'||typeof dashRecountDrafts!=='function') return false;
    if(window.DD254_AUTO_RECOUNT){ try{ await window.DD254_AUTO_RECOUNT; }catch(e){} }
    if((await draftAll()).length) return false;
    const plus2=(typeof dd254Plus2y==='function')?dd254Plus2y:function(){ return ''; };
    const recs=[], logs=[];
    /* Aurora: a solicitation skipped straight to an Original; performance ends in 100 days. */
    const aSol=exRec('demo-aur-sol','Aurora Dynamics (example) — Solicitation','sol','Skipped',
      exWs(0,{texts:{i2c:'W91CRB-26-R-0101',i2c_due:ymd(-215),i3a_date:ymd(-240)}}),
      {createdAt:stamp(-240),updatedAt:stamp(-200)});
    const aOrig=exRec('demo-aur-orig','Aurora Dynamics (example) — Original','orig','Issued',
      exWs(0,{texts:{i2a:'W91CRB-26-C-0101',i3a_date:ymd(-150)}}),
      {parentId:aSol.id,rootId:aSol.id,createdAt:stamp(-200),updatedAt:stamp(-150),issuedAt:stamp(-150),
       niss:{on:true,date:isoDay(-152),by:'RV'},dist:exDist(-150,0),popEnd:isoDay(100)});
    recs.push(aSol,aOrig);
    logs.push([aSol,'skipped','solicitation not issued — went straight to Original (example)']);
    /* Meridian: Original, Revision 1 raising safeguarding (issued, biennial review
       date set), and a Draft Revision 2 whose summary is proposed when opened. */
    const M={i2a:'N00024-25-C-2210',i9:'Systems integration and sustainment for a shipboard sensor (example).'};
    const mOrig=exRec('demo-mer-orig','Meridian Systems (example) — Original','orig','Issued',
      exWs(1,{texts:Object.assign({i3a_date:ymd(-420)},M),selects:{sfg1b:'C'}}),
      {createdAt:stamp(-430),updatedAt:stamp(-420),issuedAt:stamp(-420),niss:{on:true,date:isoDay(-421),by:'TO'},dist:exDist(-420,1),popEnd:isoDay(720)});
    const rev1Summary='Summary of changes in Revision 1 (from the Original dated '+ymd(-420)+'):\n- Item 1b Safeguarding Level: changed from Confidential to Secret.';
    const mRev1=exRec('demo-mer-rev1','Meridian Systems (example) — Rev 1','rev','Issued',
      exWs(1,{texts:Object.assign({i3a_date:ymd(-420),i3b_rev:'1',i3b_date:ymd(-60),item13:rev1Summary+'\n\n'+EX13},M),radios:{spec:'3b'}}),
      {parentId:mOrig.id,rootId:mOrig.id,revN:1,createdAt:stamp(-75),updatedAt:stamp(-60),issuedAt:stamp(-60),
       niss:{on:true,date:isoDay(-62),by:'TO'},dist:exDist(-60,1),reviewDate:plus2(isoDay(-60)),popEnd:isoDay(720)});
    const mRev2=exRec('demo-mer-rev2','Meridian Systems (example) — Rev 2','rev','Draft',
      exWs(1,{texts:Object.assign({i3a_date:ymd(-420),i3b_rev:'2',i3b_date:''},M),radios:{spec:'3b'},checks:{c11d:true},
        perf:[{loc:'Naval Surface Warfare Center (demo)\n300 Highway 361\nCrane, IN 47522',cage:'',cso:'',email:'',cma:''}]}),
      {parentId:mRev1.id,rootId:mOrig.id,revN:2,rsumPending:true,niss:null,nissPrior:{date:isoDay(-62),by:'TO',from:'rev'},
       createdAt:stamp(-2),updatedAt:stamp(-2),popEnd:isoDay(720),todos:[{text:'Confirm the hardware storage area with the program office (example).',due:isoDay(-2),done:false}]});
    recs.push(mOrig,mRev1,mRev2);
    /* Northwind issuing a SAP subcontract to Calder: Blocked on the PSO approval hold. */
    const cSap=exRec('demo-cal-sap','Calder Aerospace (example) — SAP subcontract — Original','orig','Blocked',
      exWs(3,{texts:{i2a:'SP4701-25-C-3310',i2b:'NWD-S-26-0142',i3a_date:'',i7a:exParty(2),i7b:B[2][1],i7c:CSOS[2][0]+'\n'+CSOS[2][1],
        i7fsoEmail:'fso.9cal2@example.com',i17e:B[3][1],i9:'Fabrication of test fixtures for a special access programme (example).',
        i14text:'SAP addendum requirements apply and are transmitted separately (example).',i15text:'The Program Security Officer retains inspection responsibility (example).',
        item13:'Reference 10f:\n\nAccess to the programme requires Program Security Officer approval and the SAP addendum (example).\n\n'+EX13},
        radios:{i14:'yes',i15:'yes'},checks:{sapFlag:true,c10f:true,dist18b:true}}),
      {createdAt:stamp(-12),updatedAt:stamp(-5),
       holds:[{t:'Waiting on the Program Security Officer to approve the SAP addendum (example).',s:'Blocked',d:isoDay(-5),ts:stamp(-5),done:false}]});
    if(typeof dashSyncCompliance==='function') dashSyncCompliance(cSap);
    recs.push(cSap);
    /* Northwind: two task orders issued together - one ends in 25 days, one ended a month ago. */
    [['0007',25,'demo-nwd-to7'],['0008',-30,'demo-nwd-to8']].forEach(function(x){
      const r=exRec(x[2],'Northwind Defense (example) — Task Order '+x[0]+' — Original','orig','Issued',
        exWs(3,{texts:{i2a:'SP4701-25-D-3310',iEffort:x[0],i3a_date:ymd(-20),item13:'This is in support of effort '+x[0]+'.\n\n'+EX13}}),
        {createdAt:stamp(-40),updatedAt:stamp(-20,'14:05'),issuedAt:stamp(-20,'14:05'),niss:{on:true,date:isoDay(-22),by:'JS'},
         dist:exDist(-20,3),popEnd:isoDay(x[1])});
      recs.push(r);
      logs.push([r,'status','Ready to sign → Issued (bulk issuance; example)']);
      logs.push([r,'distributed','18a (fso.4nwd8@example.com); 18e ('+CSOS[3][3]+') — bulk issuance; example']);
    });
    /* Aurora's subcontract to Calder: Original, then a Final with the disposition clock running. */
    const S={i2a:'W91CRB-23-C-0090',i2b:'AUR-S-23-0031',i3a_date:ymd(-1000),i7a:exParty(2),i7b:B[2][1],i7c:CSOS[2][0]+'\n'+CSOS[2][1],
      i7fsoEmail:'fso.9cal2@example.com',i17e:B[0][1],i9:'Prototype antenna assembly and test (example).'};
    const sOrig=exRec('demo-sub-orig','Calder Aerospace (example) — Subcontract — Original','orig','Issued',
      exWs(0,{texts:S,checks:{dist18b:true}}),
      {createdAt:stamp(-1010),updatedAt:stamp(-1000),issuedAt:stamp(-1000),niss:{on:true,date:isoDay(-1001),by:'RV'},dist:exDist(-1000,0),popEnd:isoDay(-150)});
    const sFin=exRec('demo-sub-final','Calder Aerospace (example) — Subcontract — Final','final','Issued',
      exWs(0,{texts:Object.assign({},S,{i3c_date:ymd(-120),i5_reqdate:ymd(-135),i5ret:'Two years from the final date (example)',
        item13:EX13+'\n\nReference 5:\n\nFinal disposition: at the end of the retention period, return all classified material to the Government Contracting Activity or destroy it, and notify the prime contractor in writing (example).'}),
        radios:{spec:'3c',fin:'yes'},checks:{dist18b:true}}),
      {parentId:sOrig.id,rootId:sOrig.id,createdAt:stamp(-130),updatedAt:stamp(-120),issuedAt:stamp(-120),
       niss:{on:true,date:isoDay(-121),by:'RV'},dist:exDist(-120,0),retentionDue:plus2(isoDay(-120)),popEnd:isoDay(-150)});
    recs.push(sOrig,sFin);
    /* One Ready to sign and one Cancelled. */
    const cRts=exRec('demo-cal-rts','Calder Aerospace (example) — Original','orig','Ready to sign',
      exWs(2,{texts:{i2a:'N00178-26-C-0417',i3a_date:ymd(0),i9:'Radar cross-section measurement support (example).'}}),
      {createdAt:stamp(-9),updatedAt:stamp(-1),niss:{on:true,date:isoDay(-1),by:'ML'},popEnd:isoDay(400)});
    const mCxl=exRec('demo-mer-cxl','Meridian Systems (example) — Task Order 0012 — Original','orig','Cancelled',
      exWs(1,{texts:{i2a:'N00024-25-D-2215',iEffort:'0012',i3a_date:'',item13:'This is in support of effort 0012.\n\n'+EX13}}),
      {createdAt:stamp(-25),updatedAt:stamp(-9),cancel:{reason:'Requirement withdrawn by the program office before award (example).',date:isoDay(-9),from:'Draft'}});
    recs.push(cRts,mCxl);
    logs.push([mCxl,'cancelled','Requirement withdrawn by the program office before award (example).']);
    for(const r of recs) await draftPut(r);
    if(typeof audLog==='function') logs.forEach(function(l){ audLog(l[0].id,l[0].title,l[1],l[2]); });
    /* The counts on each card are written by validation, so run it once over the examples. */
    await dashRecountDrafts(recs);
    if(typeof dashRenderCards==='function') await dashRenderCards();
    return true;
  }
  let tries=0;
  (function wait(){
    if(window.TDB_READY){ try{ demoSeed(); }catch(e){} return; }
    if(tries++>60) return;
    setTimeout(wait,100);
  })();
  /* Says what this file is, on every screen, so a demonstration build cannot be
     mistaken for the tool that prepares real forms. */
  function banner(){
    if(document.getElementById('demoBanner')) return;
    const d=document.createElement('div');
    d.id='demoBanner';
    d.textContent='DEMONSTRATION BUILD — resets on every refresh; fictitious data only. Not for preparing an actual DD Form 254.';
    d.style.cssText='position:sticky;top:0;z-index:9000;background:#7a4038;color:#fff;'
      +'font-family:Arial,sans-serif;font-size:11.5px;font-weight:bold;letter-spacing:.4px;'
      +'text-align:center;padding:5px 10px;';
    if(document.body.firstChild) document.body.insertBefore(d,document.body.firstChild);
    else document.body.appendChild(d);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',banner); else banner();
})();
</script>
