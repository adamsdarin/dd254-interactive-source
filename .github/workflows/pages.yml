# Publish the DEMO build to GitHub Pages.
#
# The demo, never the real build. The demo is seeded with fictitious templates
# and is the right thing to hand someone who wants to try the tool without
# downloading an .HTM their browser will warn about.
#
# The real build stays a download. It is identical code, but an FSO typing
# contract classification guidance into a page served from someone else's
# domain is a worse story than the same code running from their own disk --
# and "runs locally, never phones home" is the point of the tool.
#
# The demo file is discovered, not named, so a version bump needs no edit here.
name: pages

on:
  push:
    branches: [main]
    paths:
      - '01_TOOL/DD254_Interactive_v*_DEMO.HTM'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Assemble the site
        run: |
          mkdir -p _site
          DEMO="$(python3 .github/scripts/newest_build.py --demo)"
          echo "publishing $(basename "$DEMO")"
          cp "$DEMO" _site/index.html
          # Keep the versioned name alongside index.html so a link to a
          # specific demo build does not rot when the next one ships.
          cp "$DEMO" "_site/$(basename "$DEMO")"
          # No Jekyll: the payload is one self-contained HTML file and must be
          # served byte-for-byte, not run through a template engine.
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
